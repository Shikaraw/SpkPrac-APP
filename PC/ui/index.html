<!doctype html>
<html lang="zh-CN" data-theme="dark" data-animations="on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>SpkPrac</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/screens.css" />
  </head>
  <body>
    <!-- ambient backdrop -->
    <div class="aurora" aria-hidden="true">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" id="brand-mark"></div>
          <div class="brand-text">
            <div class="brand-name">SpkPrac</div>
            <div class="brand-sub">Voice · Practice</div>
          </div>
        </div>

        <nav class="nav" id="nav"></nav>

        <div class="sidebar-foot">
          <div class="foot-line">
            <span class="foot-text" id="foot-theme-label"></span>
            <button class="btn btn-icon btn-sm" id="theme-toggle" title="Theme"></button>
          </div>
          <div class="foot-line">
            <span class="foot-text faint" id="foot-version"></span>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="page-header" id="page-header"></header>
        <div class="page-body" id="page-body"></div>
      </main>
    </div>

    <div id="session-root"></div>
    <div id="dialog-root"></div>
    <div class="toasts" id="toasts"></div>

    <script src="js/i18n.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/store.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/orb.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/rt.js"></script>
    <script src="js/session.js"></script>
    <script src="js/screens/home.js"></script>
    <script src="js/screens/practice.js"></script>
    <script src="js/screens/session.js"></script>
    <script src="js/screens/detail.js"></script>
    <script src="js/screens/settings.js"></script>
    <script src="js/screens/voices.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
