name: Cleanup releases

# One-off maintenance: pushing a `cleanup-releases-*` tag deletes the listed
# superseded releases together with their git tags.
on:
  push:
    tags: ['cleanup-releases-*']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          REPO="${{ github.repository }}"
          for t in v0.1.1 pc-v0.1.1; do
            gh release delete "$t" -R "$REPO" --yes --cleanup-tag && echo "deleted $t" || echo "skip $t"
          done
          gh release list -R "$REPO"
